<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="骡马搜图">
  <title>骡马搜图</title>
  <desc>上传或粘贴一张图片，通过 IQDB 与 TRACE.MOE 反查图片出处与番剧截图来源</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141428" />
      <stop offset="55%" stop-color="#1c1b3a" />
      <stop offset="100%" stop-color="#0e1016" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d4df6" />
      <stop offset="100%" stop-color="#0f9d8f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#6d4df6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6d4df6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.05" r="0.6">
      <stop offset="0%" stop-color="#0f9d8f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f9d8f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- 品牌标记 -->
  <g transform="translate(84, 96)">
    <rect width="96" height="96" rx="26" fill="url(#brand)" />
    <text x="48" y="60" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="25"
      font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LuoMa</text>
  </g>

  <text x="84" y="290" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
    font-size="68" font-weight="700" fill="#f4f5fb">骡马搜图</text>
  <text x="84" y="352" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="30" font-weight="500" fill="#9b9fc0" letter-spacing="2">LuoMa Image Search</text>

  <text x="84" y="428" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
    font-size="26" fill="#c4c8e0">上传、拖拽或粘贴截图，反查图片来源与番剧出处</text>

  <!-- 引擎标签 -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600">
    <rect x="84" y="470" width="188" height="60" rx="30" fill="#6d4df6" fill-opacity="0.22"
      stroke="#6d4df6" stroke-opacity="0.65" />
    <text x="178" y="508" fill="#b7a8ff" text-anchor="middle">IQDB 图源</text>

    <rect x="292" y="470" width="242" height="60" rx="30" fill="#0f9d8f" fill-opacity="0.2"
      stroke="#0f9d8f" stroke-opacity="0.6" />
    <text x="413" y="508" fill="#6ee7d8" text-anchor="middle">TRACE.MOE 番剧</text>

    <rect x="554" y="470" width="228" height="60" rx="30" fill="#ffffff" fill-opacity="0.06"
      stroke="#ffffff" stroke-opacity="0.18" />
    <text x="668" y="508" fill="#c4c8e0" text-anchor="middle">8 个图库检索</text>
  </g>

  <!-- 装饰：搜索放大镜 -->
  <g transform="translate(905, 250)" opacity="0.9">
    <circle cx="110" cy="110" r="104" fill="none" stroke="#6d4df6" stroke-opacity="0.5"
      stroke-width="10" />
    <circle cx="110" cy="110" r="76" fill="#ffffff" fill-opacity="0.05" />
    <rect x="176" y="176" width="112" height="22" rx="11" fill="#0f9d8f" fill-opacity="0.8"
      transform="rotate(45 176 176)" />
    <path d="M74 118 L104 148 L152 84" fill="none" stroke="#6ee7d8" stroke-width="12"
      stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="1116" y="566" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22"
    fill="#7b8299" text-anchor="end">img.muri.life</text>
</svg>
